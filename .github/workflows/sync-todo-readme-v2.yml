name: sync-todo-readme-v2

on:
  push:
    branches: [dev]
    paths:
      - '.github/workflows/sync-todo-readme-v2.yml'
      - '.github/scripts/sync_todo_readme.py'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sync-todo-readme:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out dev
        uses: actions/checkout@v4
        with:
          ref: dev
          fetch-depth: 0

      - name: Extract TODOs and update README
        run: python3 .github/scripts/sync_todo_readme.py

      - name: Commit README update
        run: |
          set -euo pipefail
          if git diff --quiet -- README.md; then
            echo "README already up to date"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.md
          git commit -m "docs: sync README complete TODO list"
          git push origin HEAD:dev
