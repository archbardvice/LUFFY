name: todo-sync

on:
  workflow_dispatch:
    inputs:
      apply:
        description: Apply README update and push to dev
        required: false
        default: "false"

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: dev
          fetch-depth: 0
      - name: Diagnose repository
        run: |
          set -euo pipefail
          pwd
          git status --short --branch
          git remote -v | sed 's#//[^@]*@#//***@#'
          git diff --name-only origin/main...HEAD -- '*.py' || true
          python - <<'PY'
          from pathlib import Path
          import re, subprocess
          root=Path('.')
          pys=sorted(p.as_posix() for p in root.rglob('*.py') if '.git' not in p.parts)
          todo=[]
          for p in pys:
              for n,line in enumerate(Path(p).read_text(errors='replace').splitlines(),1):
                  if re.search(r'(?<![A-Za-z0-9_])TODO(?![A-Za-z0-9_])', line):
                      todo.append((p,n,line.strip()))
          print('PY_FILES', len(pys), 'TODO_LINES', len(todo))
          for rec in todo:
              if rec[0] in {'luffy/deepscaler/utils.py','luffy/verl/verl/protocol.py'}:
                  print('CHANGED_TODO', rec[0], rec[1], rec[2])
          text=Path('README.md').read_text()
          print('README_CHARS', len(text), 'COMPLETE_HEADING', '### 📝 Complete TODO List' in text)
          print('README_ITEMS', len(re.findall(r'^- \[ \] \*\*[^*]+:\d+\*\* - ', text, re.M)))
          PY
